<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرر مخطط السمكة – Fishbone Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --text: #2c2c2a;
    --text2: #5f5e5a;
    --text3: #888780;
    --accent: #1D9E75;
    --accent-light: #E1F5EE;
    --danger: #E24B4A;
    --danger-light: #FCEBEB;
    --info: #378ADD;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
  }

  [data-theme="dark"] {
    --bg: #1a1a18;
    --surface: #2c2c2a;
    --surface2: #222220;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
    --text: #e8e6de;
    --text2: #b4b2a9;
    --text3: #888780;
    --accent-light: #085041;
    --danger-light: #4A1B0C;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo svg { width: 26px; height: 26px; }
  header .spacer { flex: 1; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface2); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.primary:hover { opacity: 0.88; }
  .btn.danger-btn { background: var(--danger-light); color: var(--danger); border-color: transparent; }
  .btn.icon-btn { padding: 7px 9px; }

  /* ── TOOLBAR ── */
  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.65rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .effect-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 260px;
  }
  .effect-group label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  #effect-input {
    flex: 1;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 7px 12px;
    background: var(--surface2);
    color: var(--text);
    transition: border-color 0.15s;
    min-width: 0;
  }
  #effect-input:focus { outline: none; border-color: var(--accent); }

  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── CANVAS ── */
  main {
    padding: 1.5rem;
    overflow-x: auto;
  }
  #canvas-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    max-width: 100%;
  }
  #fish {
    display: block;
    width: 100%;
    min-width: 520px;
  }

  /* ── HINT ── */
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    padding: 0.5rem 1rem;
    border-top: 1px solid var(--border);
  }

  /* ── MODAL OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    padding: 1rem;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border2);
    box-shadow: var(--shadow-lg);
    padding: 1.5rem;
    width: 100%;
    max-width: 400px;
    transform: translateY(16px) scale(0.97);
    transition: transform 0.2s;
  }
  .overlay.open .modal { transform: none; }

  .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 1rem; }
  .modal label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea {
    width: 100%;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 10px;
    background: var(--surface2);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }

  .sub-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .sub-item {
    display: flex;
    gap: 6px;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 8px;
  }
  .sub-item span { flex: 1; font-size: 13px; }
  .sub-item button { font-size: 11px; padding: 3px 7px; border-radius: 6px; }

  .add-sub-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-sub-row input { flex: 1; }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* ── COLOR CHIPS ── */
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .color-chip {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .color-chip:hover { transform: scale(1.15); }
  .color-chip.selected { border-color: var(--text); }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: var(--text);
    color: var(--surface);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 300;
    white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  /* ── EXPORT MENU ── */
  .export-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    display: none;
    flex-direction: column;
    min-width: 160px;
    z-index: 100;
    overflow: hidden;
  }
  .export-menu.open { display: flex; }
  .export-menu button {
    padding: 10px 14px;
    border: none;
    border-radius: 0;
    text-align: right;
    background: none;
    font-size: 13px;
    cursor: pointer;
  }
  .export-menu button:hover { background: var(--surface2); }
  .export-wrap { position: relative; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .toolbar { padding: 0.5rem 1rem; }
    main { padding: 1rem; }
    .logo span { display: none; }
  }
</style>
</head>
<body data-theme="light">

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 26 26" fill="none"><path d="M2 13 Q6 5 13 5 Q20 5 24 13 Q20 21 13 21 Q6 21 2 13Z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="20" cy="13" r="4" fill="currentColor" opacity="0.3"/><line x1="2" y1="13" x2="20" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>Fishbone Diagram</span>
  </div>
  <div class="spacer"></div>
  <button class="btn icon-btn" onclick="toggleTheme()" title="تغيير المظهر" id="theme-btn">🌙</button>
  <button class="btn icon-btn" onclick="showHelp()" title="مساعدة">❓</button>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="effect-group">
    <label for="effect-input">رأس السمكة (المشكلة):</label>
    <input id="effect-input" value="المشكلة الرئيسية" oninput="redraw()" placeholder="اكتب المشكلة هنا...">
  </div>
  <div class="toolbar-actions">
    <button class="btn primary" onclick="openAddCause()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      سبب رئيسي
    </button>
    <div class="export-wrap">
      <button class="btn" onclick="toggleExportMenu()" id="export-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M3 6l4 4 4-4M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        تصدير ▾
      </button>
      <div class="export-menu" id="export-menu">
        <button onclick="exportSVG()">📄 تصدير SVG</button>
        <button onclick="exportPNG()">🖼️ تصدير PNG</button>
        <button onclick="exportJSON()">📋 حفظ البيانات (JSON)</button>
        <button onclick="document.getElementById('import-file').click()">📂 استيراد JSON</button>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
</div>

<!-- CANVAS -->
<main>
  <div id="canvas-card">
    <svg id="fish" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="hint">💡 اضغط على أي سبب (مستطيل ملون) لتعديله أو حذفه — اضغط على "+" لإضافة سبب جديد</div>
  </div>
</main>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">إضافة سبب رئيسي</h2>

    <label>اسم السبب الرئيسي</label>
    <input id="modal-name" placeholder="مثال: الناس، الأدوات، البيئة..." onkeydown="if(event.key==='Enter')document.getElementById('new-sub-input').focus()">

    <label>لون السبب</label>
    <div class="color-row" id="color-row"></div>

    <label>الأسباب الفرعية</label>
    <ul class="sub-list" id="sub-list"></ul>
    <div class="add-sub-row">
      <input id="new-sub-input" placeholder="أضف سبباً فرعياً..." onkeydown="if(event.key==='Enter')addSub()">
      <button class="btn" onclick="addSub()">إضافة</button>
    </div>

    <div class="modal-actions">
      <button class="btn primary" onclick="saveModal()">حفظ</button>
      <button class="btn danger-btn" id="del-btn" onclick="deleteCause()" style="display:none">حذف</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<script>
// ── DATA ──────────────────────────────────────────────
const PALETTE = [
  '#1D9E75','#378ADD','#D85A30','#7F77DD',
  '#BA7517','#D4537E','#639922','#0F6E56',
];

let causes = [
  { name: 'الناس',   color: PALETTE[0], subs: ['قلة التدريب', 'غياب المسؤولية', 'ضعف التواصل'] },
  { name: 'الأدوات', color: PALETTE[1], subs: ['معدات قديمة', 'صيانة سيئة'] },
  { name: 'الطريقة', color: PALETTE[2], subs: ['إجراءات غير واضحة', 'غياب التوثيق'] },
  { name: 'البيئة',  color: PALETTE[3], subs: ['ضغط العمل', 'بيئة غير ملائمة'] },
];

let editIdx = null;
let modalSubs = [];
let modalColor = PALETTE[0];

// ── THEME ─────────────────────────────────────────────
function toggleTheme() {
  const body = document.body;
  const isDark = body.dataset.theme === 'dark';
  body.dataset.theme = isDark ? 'light' : 'dark';
  document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
  redraw();
}

// ── DRAW ──────────────────────────────────────────────
const svgEl = document.getElementById('fish');
const W = 860, H = 420;
const SPINE_Y = H / 2;
const HEAD_X = W - 100;
const TAIL_X = 50;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function mkEl(tag, attrs, text) {
  const el = ns(tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function getVar(v) {
  return getComputedStyle(document.body).getPropertyValue(v).trim();
}

function redraw() {
  const effect = document.getElementById('effect-input').value.trim() || 'المشكلة';
  const isDark = document.body.dataset.theme === 'dark';
  const textColor = isDark ? '#e8e6de' : '#2c2c2a';
  const mutedColor = isDark ? '#888780' : '#73726c';
  const bgColor = isDark ? '#2c2c2a' : '#ffffff';
  const bg2Color = isDark ? '#222220' : '#f7f6f2';
  const borderColor = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';

  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.innerHTML = '';

  // defs
  const defs = ns('defs');
  defs.innerHTML = `
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="${mutedColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  `;
  svgEl.appendChild(defs);

  // Background
  svgEl.appendChild(mkEl('rect', { x:0, y:0, width:W, height:H, fill: bg2Color }));

  // Grid lines (subtle)
  for (let x = 60; x < W; x += 80) {
    const l = mkEl('line', { x1:x, y1:0, x2:x, y2:H, stroke:borderColor, 'stroke-width':'0.5', 'stroke-dasharray':'4 6' });
    svgEl.appendChild(l);
  }

  // ── SPINE ──
  const spine = mkEl('line', {
    x1: TAIL_X + 36, y1: SPINE_Y,
    x2: HEAD_X - 2, y2: SPINE_Y,
    stroke: mutedColor, 'stroke-width': 2.5,
    'marker-end': 'url(#arr)'
  });
  svgEl.appendChild(spine);

  // ── FISH HEAD ──
  const headG = ns('g');
  headG.style.cursor = 'default';

  const headRx = 55, headRy = 36;
  const headEl = mkEl('ellipse', {
    cx: HEAD_X + headRx - 10, cy: SPINE_Y,
    rx: headRx, ry: headRy,
    fill: PALETTE[0], opacity: '0.9',
    stroke: PALETTE[0], 'stroke-width': 1,
  });
  headG.appendChild(headEl);

  // Head text (wrapped)
  const words = effect.split(' ');
  const mid = Math.ceil(words.length / 2);
  const line1 = words.slice(0, mid).join(' ');
  const line2 = words.slice(mid).join(' ');
  const hcx = HEAD_X + headRx - 10;

  if (line2) {
    const t1 = mkEl('text', { x: hcx, y: SPINE_Y - 8, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 12, fill: '#fff', 'font-weight': 600, 'font-family': 'Cairo, sans-serif' }, line1);
    const t2 = mkEl('text', { x: hcx, y: SPINE_Y + 10, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 12, fill: '#fff', 'font-weight': 600, 'font-family': 'Cairo, sans-serif' }, line2);
    headG.appendChild(t1); headG.appendChild(t2);
  } else {
    const t1 = mkEl('text', { x: hcx, y: SPINE_Y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 12, fill: '#fff', 'font-weight': 600, 'font-family': 'Cairo, sans-serif' }, line1);
    headG.appendChild(t1);
  }

  // Eye
  const eye = mkEl('circle', { cx: HEAD_X + headRx + 20, cy: SPINE_Y - 10, r: 6, fill: '#fff', opacity: '0.9' });
  const pupil = mkEl('circle', { cx: HEAD_X + headRx + 20, cy: SPINE_Y - 10, r: 3, fill: '#222' });
  headG.appendChild(eye); headG.appendChild(pupil);

  // Mouth
  const mouth = mkEl('path', { d: `M${HEAD_X + headRx + 50},${SPINE_Y - 6} Q${HEAD_X + headRx + 60},${SPINE_Y} ${HEAD_X + headRx + 50},${SPINE_Y + 6}`, fill: 'none', stroke: '#fff', 'stroke-width': 1.5, 'stroke-linecap': 'round' });
  headG.appendChild(mouth);
  svgEl.appendChild(headG);

  // ── FISH TAIL ──
  const tailPts = `${TAIL_X + 36},${SPINE_Y} ${TAIL_X},${SPINE_Y - 38} ${TAIL_X + 22},${SPINE_Y} ${TAIL_X},${SPINE_Y + 38}`;
  const tailEl = mkEl('polygon', { points: tailPts, fill: bg2Color, stroke: mutedColor, 'stroke-width': 1.5, 'stroke-linejoin': 'round' });
  svgEl.appendChild(tailEl);

  // ── FINS (top & bottom small decorative) ──
  const fin1 = mkEl('path', { d: `M${TAIL_X+60},${SPINE_Y} Q${TAIL_X+80},${SPINE_Y-55} ${TAIL_X+120},${SPINE_Y}`, fill: 'none', stroke: mutedColor, 'stroke-width': 1, opacity: '0.4' });
  svgEl.appendChild(fin1);

  // ── CAUSES ──
  const n = causes.length;
  if (n === 0) {
    const noEl = mkEl('text', {
      x: W/2 - 60, y: SPINE_Y,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 13, fill: mutedColor, 'font-family': 'Cairo, sans-serif'
    }, 'اضغط "+ سبب رئيسي" لإضافة سبب');
    svgEl.appendChild(noEl);
  }

  const usableWidth = HEAD_X - TAIL_X - 100;
  const spacing = Math.min(150, usableWidth / Math.max(n, 1));
  const ANGLE_DEG = 42;

  causes.forEach((c, i) => {
    const col = c.color;
    const side = i % 2 === 0 ? -1 : 1; // -1 = up, 1 = down
    const bx = TAIL_X + 80 + i * spacing;
    const bLen = 90;
    const ang = (side * ANGLE_DEG * Math.PI) / 180;
    const ex = bx + bLen * Math.cos(ang);
    const ey = SPINE_Y + bLen * Math.sin(ang);

    // Main bone
    const boneG = ns('g');
    boneG.style.cursor = 'pointer';
    boneG.setAttribute('onclick', `openEdit(${i})`);

    const boneLine = mkEl('line', {
      x1: bx, y1: SPINE_Y, x2: ex, y2: ey,
      stroke: col, 'stroke-width': 2.5, 'stroke-linecap': 'round'
    });
    boneG.appendChild(boneLine);

    // Label pill
    const label = c.name;
    const lw = Math.max(70, label.length * 8 + 20);
    const lh = 26;
    const lx = ex + (Math.cos(ang) > 0 ? 4 : -lw - 4);
    const ly = ey - lh / 2;

    const pill = mkEl('rect', {
      x: lx, y: ly, width: lw, height: lh,
      rx: 13, fill: col, opacity: '0.92'
    });
    boneG.appendChild(pill);

    const pillText = mkEl('text', {
      x: lx + lw / 2, y: ey,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 12, fill: '#fff', 'font-weight': 600,
      'font-family': 'Cairo, sans-serif'
    }, label);
    boneG.appendChild(pillText);

    // Edit icon on hover (pencil circle)
    const editCircle = mkEl('circle', {
      cx: lx + lw - 10, cy: ly + lh / 2,
      r: 0, fill: '#fff', opacity: '0.3'
    });
    boneG.appendChild(editCircle);

    svgEl.appendChild(boneG);

    // ── Sub-bones ──
    c.subs.forEach((s, j) => {
      const t = 0.25 + j * 0.2;
      const sx = bx + t * (ex - bx);
      const sy = SPINE_Y + t * (ey - SPINE_Y);
      const subLen = 44;
      const perpAng = ang + Math.PI / 2;
      const sfx = sx + subLen * Math.cos(perpAng);
      const sfy = sy + subLen * Math.sin(perpAng);

      const subLine = mkEl('line', {
        x1: sx, y1: sy, x2: sfx, y2: sfy,
        stroke: col, 'stroke-width': 1.2, 'stroke-linecap': 'round', opacity: '0.75'
      });
      svgEl.appendChild(subLine);

      // Dot at tip
      const dot = mkEl('circle', { cx: sfx, cy: sfy, r: 3, fill: col, opacity: '0.6' });
      svgEl.appendChild(dot);

      // Sub label
      const sAnchor = sfx > sx ? 'start' : 'end';
      const stx = sfx + (sfx > sx ? 6 : -6);
      const sty = sfy + (sfy < sy ? -3 : 3);
      const subText = mkEl('text', {
        x: stx, y: sty,
        'text-anchor': sAnchor, 'dominant-baseline': 'central',
        'font-size': 11, fill: col, 'font-weight': 500,
        'font-family': 'Cairo, sans-serif'
      }, s);
      svgEl.appendChild(subText);
    });
  });

  // ── ADD CAUSE HINT ──
  const nextX = TAIL_X + 80 + n * spacing;
  if (nextX < HEAD_X - 80 && n < 8) {
    const addG = ns('g');
    addG.style.cursor = 'pointer';
    addG.setAttribute('onclick', 'openAddCause()');

    const addCircle = mkEl('circle', {
      cx: nextX, cy: SPINE_Y - 24,
      r: 16, fill: 'none', stroke: mutedColor,
      'stroke-width': 1.5, 'stroke-dasharray': '4 3'
    });
    const addText = mkEl('text', {
      x: nextX, y: SPINE_Y - 24,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 18, fill: mutedColor, 'font-family': 'Cairo, sans-serif'
    }, '+');
    const addLabel = mkEl('text', {
      x: nextX, y: SPINE_Y - 46,
      'text-anchor': 'middle', 'font-size': 10,
      fill: mutedColor, 'font-family': 'Cairo, sans-serif'
    }, 'إضافة');
    addG.appendChild(addCircle);
    addG.appendChild(addText);
    addG.appendChild(addLabel);
    svgEl.appendChild(addG);
  }
}

// ── MODAL LOGIC ───────────────────────────────────────
function buildColorRow(selected) {
  const row = document.getElementById('color-row');
  row.innerHTML = '';
  PALETTE.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (c === selected ? ' selected' : '');
    chip.style.background = c;
    chip.onclick = () => {
      modalColor = c;
      buildColorRow(c);
    };
    row.appendChild(chip);
  });
}

function renderSubList() {
  const ul = document.getElementById('sub-list');
  ul.innerHTML = '';
  modalSubs.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'sub-item';
    const span = document.createElement('span');
    span.textContent = s;
    const editIn = document.createElement('input');
    editIn.value = s;
    editIn.style.flex = '1';
    editIn.oninput = () => { modalSubs[i] = editIn.value; };
    const del = document.createElement('button');
    del.className = 'btn danger-btn';
    del.textContent = '×';
    del.onclick = () => { modalSubs.splice(i, 1); renderSubList(); };
    li.appendChild(editIn);
    li.appendChild(del);
    ul.appendChild(li);
  });
}

function openAddCause() {
  editIdx = null;
  modalSubs = [];
  modalColor = PALETTE[causes.length % PALETTE.length];
  document.getElementById('modal-title').textContent = 'إضافة سبب رئيسي';
  document.getElementById('modal-name').value = '';
  document.getElementById('del-btn').style.display = 'none';
  buildColorRow(modalColor);
  renderSubList();
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 200);
}

function openEdit(i) {
  editIdx = i;
  modalSubs = [...causes[i].subs];
  modalColor = causes[i].color;
  document.getElementById('modal-title').textContent = 'تعديل: ' + causes[i].name;
  document.getElementById('modal-name').value = causes[i].name;
  document.getElementById('del-btn').style.display = '';
  buildColorRow(modalColor);
  renderSubList();
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

function addSub() {
  const inp = document.getElementById('new-sub-input');
  const v = inp.value.trim();
  if (!v) return;
  modalSubs.push(v);
  inp.value = '';
  renderSubList();
  inp.focus();
}

function saveModal() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  const subs = modalSubs.map(s => s.trim()).filter(Boolean);
  if (editIdx === null) {
    causes.push({ name, color: modalColor, subs });
  } else {
    causes[editIdx] = { name, color: modalColor, subs };
  }
  closeModal();
  redraw();
}

function deleteCause() {
  if (editIdx !== null) causes.splice(editIdx, 1);
  closeModal();
  redraw();
}

// Close on overlay click
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ── EXPORT ────────────────────────────────────────────
function toggleExportMenu() {
  document.getElementById('export-menu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.export-wrap')) {
    document.getElementById('export-menu').classList.remove('open');
  }
});

function exportSVG() {
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  // embed font
  const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.textContent = `@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');`;
  clone.insertBefore(style, clone.firstChild);
  const blob = new Blob([clone.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
  download(URL.createObjectURL(blob), 'fishbone-diagram.svg');
  document.getElementById('export-menu').classList.remove('open');
}

function exportPNG() {
  const svgData = svgEl.outerHTML;
  const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = document.body.dataset.theme === 'dark' ? '#222220' : '#f7f6f2';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => download(URL.createObjectURL(b), 'fishbone-diagram.png'));
    URL.revokeObjectURL(url);
  };
  img.src = url;
  document.getElementById('export-menu').classList.remove('open');
}

function exportJSON() {
  const data = {
    effect: document.getElementById('effect-input').value,
    causes,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  download(URL.createObjectURL(blob), 'fishbone-data.json');
  document.getElementById('export-menu').classList.remove('open');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.effect) document.getElementById('effect-input').value = data.effect;
      if (Array.isArray(data.causes)) causes = data.causes;
      redraw();
    } catch { alert('ملف غير صالح'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
