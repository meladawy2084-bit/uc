<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مخطط هيكل السمكة - Fishbone Diagram</title>
    <!-- html2canvas library for exporting image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 400px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.5em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 0;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .category-item {
            background: #f1f3f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-right: 4px solid var(--secondary-color);
        }

        .category-header {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .sub-cause-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            padding-right: 15px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-add { background-color: #27ae60; color: white; width: 100%; margin-top: 5px; }
        .btn-remove { background-color: var(--accent-color); color: white; padding: 5px 10px; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-import { background-color: #f39c12; color: white; flex: 1; padding: 12px;}
        .btn-export-json { background-color: #8e44ad; color: white; flex: 1; padding: 12px;}
        .btn-export-img { background-color: var(--primary-color); color: white; width: 100%; font-size: 1.1em; padding: 15px; margin-top: 10px; }

        /* Canvas Area */
        .canvas-area {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: #e9ecef;
            position: relative;
        }

        /* 
           الحجم الطبيعي للرؤية على الشاشة (بدون مسافات ضخمة تعطل الموبايل) 
        */
        #export-target {
            background: white;
            padding: 100px; 
            margin: auto; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            border-radius: 12px;
            transition: padding 0s; /* منع التأثير البطيء لتغيير الحجم */
        }

        /* 
           الكلاس ده بيشتغل بس لحظة التقاط الصورة (Export) عشان يوسع المساحة ويمنع القص
        */
        #export-target.export-mode {
            padding: 300px 200px 300px 450px !important; 
        }

        .diagram-container {
            position: relative;
            width: 950px; 
            height: 10px; 
            display: flex;
            align-items: center;
        }

        .spine {
            width: 100%;
            height: 6px;
            background: #2c3e50;
            position: relative;
            border-radius: 3px;
        }

        /* رأس السمكة (مثلث) */
        .head {
            position: absolute;
            right: -130px; 
            top: -65px; 
            width: 140px;
            height: 130px;
            background: var(--accent-color);
            color: white;
            clip-path: polygon(100% 50%, 0 0, 0 100%); /* شكل المثلث */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 40px 10px 10px; /* دفع النص للجهة الواسعة من المثلث */
            box-sizing: border-box;
            font-weight: bold;
            font-size: 1.1em;
            word-break: break-word;
        }

        .bone {
            position: absolute;
            width: 4px;
            height: 260px; 
            background: #444;
            border-radius: 2px;
        }

        .bone-label-box {
            position: absolute;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 1.1em;
        }

        .bone-top {
            bottom: 100%; 
            transform-origin: center bottom;
            transform: rotate(45deg); 
        }
        .bone-top .bone-label-box {
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bone-bottom {
            top: 100%; 
            transform-origin: center top;
            transform: rotate(-45deg); 
        }
        .bone-bottom .bone-label-box {
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .sub-bone-line {
            position: absolute;
            height: 2px;
            background: #7f8c8d;
            width: 60px;
        }

        .sub-bone-text {
            position: absolute;
            font-size: 0.95em;
            white-space: nowrap;
            color: #2c3e50;
            font-weight: 600;
        }

        .bone-top .sub-bone-line { right: 0; transform: rotate(-45deg); transform-origin: right center; }
        .bone-bottom .sub-bone-line { right: 0; transform: rotate(45deg); transform-origin: right center; }

        /* توافق الموبايل والشاشات الصغيرة */
        @media (max-width: 1000px) {
            body { 
                flex-direction: column; /* تحويل العرض ليكون عمودي */
                height: 100vh;
            }
            .sidebar { 
                width: 100%; 
                height: 45vh; /* أخذ مساحة محددة لأدوات التحكم */
                border-bottom: 3px solid var(--secondary-color);
                box-sizing: border-box;
            }
            .canvas-area { 
                width: 100%; 
                height: 55vh; /* أخذ المساحة المتبقية للرسمة */
                padding: 10px;
                box-sizing: border-box;
                align-items: flex-start;
                justify-content: flex-start;
            }
            #export-target {
                margin: 0; /* لضمان ظهور الرسمة كاملة والسماح بالـ Scroll */
                padding: 60px; /* تصغير المساحة البيضاء للموبايل */
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>إعدادات المخطط</h2>
        
        <div class="input-group">
            <label>المشكلة الأساسية (الأثر - Effect)</label>
            <input type="text" id="head-input" style="width: 100%" oninput="updateDiagram()">
        </div>

        <hr>
        <h3>الأسباب الرئيسية</h3>
        <div id="categories-list">
            <!-- Dynamic categories will load here -->
        </div>

        <button class="btn-add" onclick="addCategory()">+ إضافة سبب رئيسي جديد</button>
        
        <hr style="margin-top:20px;">
        
        <div class="action-buttons">
            <button class="btn-import" onclick="document.getElementById('file-import').click()">📂 استيراد JSON</button>
            <button class="btn-export-json" onclick="exportJSON()">💾 تصدير JSON</button>
            <input type="file" id="file-import" accept=".json" style="display: none;" onchange="importJSON(event)">
        </div>
        
        <button class="btn-export-img" onclick="exportAsImage()">📥 حفظ كصورة (PNG)</button>
        
    </div>

    <div class="canvas-area" id="canvas-scroll-area">
        <div id="export-target">
            <div class="diagram-container">
                <div class="spine" id="spine">
                    <div class="head" id="head-node">المشكلة</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let diagramData = {
            "effect": "عدم حل الواجبات",
            "causes": [
                {
                    "name": "الطريقة ( المهارات)",
                    "color": "#1D9E75",
                    "subs": ["مش فاهم الواجب", "بتكسف أسأل", "مش فاهم طريقة الحل", "دروس كتير"]
                },
                {
                    "name": "الأدوات",
                    "color": "#378ADD",
                    "subs": ["أدوات مش كويسة ( كراسة , قلم , برجل)", "كمبيوتر قديم", "مش بعرف أستخدم البرامج"]
                },
                {
                    "name": "عدم التركيز",
                    "color": "#D85A30",
                    "subs": ["إزعاج الأشخاص", "الموبايل", "إزعاج المحيط (عربيات...)", "عدم التركيز في الحصة", "الجوع والعطش"]
                },
                {
                    "name": "الدافع",
                    "color": "#7F77DD",
                    "subs": ["عايز ألعب", "مش مهم", "التسويف ( الكسل, بعدين..)", "مش بحب المادة دي", "الواجب ممل", "الواجب كتير", "ثقة زيادة في سهولة الواجب", "نقص التشجيع"]
                },
                {
                    "name": "الناس",
                    "color": "#7F77DD",
                    "subs": ["مش فاهم من المدرس", "المدرس مش بيحبني", "المدرس مش مهتم بيا"]
                }
            ]
        };

        function addCategory() {
            diagramData.causes.push({ name: "سبب رئيسي جديد", color: "#34495e", subs: ["سبب فرعي"] });
            updateUI();
        }

        function removeCategory(index) {
            diagramData.causes.splice(index, 1);
            updateUI();
        }

        function updateCategoryName(index, val) {
            diagramData.causes[index].name = val;
            renderCanvas();
        }

        function updateCategoryColor(index, val) {
            diagramData.causes[index].color = val;
            renderCanvas();
            document.getElementById(`cat-box-${index}`).style.borderRightColor = val;
        }

        function addSubCause(catIndex) {
            diagramData.causes[catIndex].subs.push("سبب فرعي جديد");
            updateUI();
        }

        function removeSubCause(catIndex, subIndex) {
            diagramData.causes[catIndex].subs.splice(subIndex, 1);
            updateUI();
        }

        function updateSubName(catIndex, subIndex, val) {
            diagramData.causes[catIndex].subs[subIndex] = val;
            renderCanvas();
        }

        function updateDiagram() {
            diagramData.effect = document.getElementById('head-input').value;
            renderCanvas();
        }

        function updateUI() {
            document.getElementById('head-input').value = diagramData.effect;
            
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            
            diagramData.causes.forEach((cat, cIndex) => {
                const catColor = cat.color || "#3498db";
                const catDiv = document.createElement('div');
                catDiv.className = 'category-item';
                catDiv.id = `cat-box-${cIndex}`;
                catDiv.style.borderRightColor = catColor;
                
                catDiv.innerHTML = `
                    <div class="category-header">
                        <input type="color" value="${catColor}" onchange="updateCategoryColor(${cIndex}, this.value)" title="اختر لون">
                        <input type="text" value="${cat.name}" oninput="updateCategoryName(${cIndex}, this.value)">
                        <button class="btn-remove" onclick="removeCategory(${cIndex})">حذف</button>
                    </div>
                    <div id="subs-${cIndex}">
                        ${cat.subs.map((sub, sIndex) => `
                            <div class="sub-cause-item">
                                <input type="text" value="${sub}" oninput="updateSubName(${cIndex}, ${sIndex}, this.value)">
                                <button class="btn-remove" style="background:#95a5a6" onclick="removeSubCause(${cIndex}, ${sIndex})">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-add" style="background:#3498db; font-size:0.85em" onclick="addSubCause(${cIndex})">+ سبب فرعي</button>
                `;
                list.appendChild(catDiv);
            });
            renderCanvas();
        }

        function renderCanvas() {
            const headNode = document.getElementById('head-node');
            const spine = document.getElementById('spine');
            
            headNode.innerText = diagramData.effect;
            
            const existingBones = spine.querySelectorAll('.bone');
            existingBones.forEach(b => b.remove());

            const total = diagramData.causes.length;
            const spacing = 85 / (total + 1); 

            diagramData.causes.forEach((cat, index) => {
                const isTop = index % 2 === 0;
                const pos = 100 - (8 + spacing * (index + 1));
                const catColor = cat.color || "#3498db";
                
                const bone = document.createElement('div');
                bone.className = `bone ${isTop ? 'bone-top' : 'bone-bottom'}`;
                bone.style.right = pos + '%';
                
                bone.innerHTML = `<div class="bone-label-box" style="background-color: ${catColor}">${cat.name}</div>`;
                
                const subSpacing = 75 / (cat.subs.length + 1);
                cat.subs.forEach((sub, sIndex) => {
                    const subPos = 15 + subSpacing * (sIndex + 1);
                    const subLine = document.createElement('div');
                    subLine.className = 'sub-bone-line';
                    subLine.style[isTop ? 'bottom' : 'top'] = subPos + '%';
                    
                    const subText = document.createElement('div');
                    subText.className = 'sub-bone-text';
                    subText.innerText = sub;
                    subText.style.right = '70px'; 
                    subText.style.top = '-12px'; 
                    
                    subLine.appendChild(subText);
                    bone.appendChild(subLine);
                });

                spine.appendChild(bone);
            });
        }

        function exportJSON() {
            diagramData.exportedAt = new Date().toISOString();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(diagramData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `Fishbone_${new Date().getTime()}.json`);
            dlAnchorElem.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.effect && data.causes) {
                        diagramData = data;
                        updateUI();
                    } else {
                        alert("ملف JSON غير متوافق! تأكد من الهيكل المطلوب.");
                    }
                } catch (error) {
                    alert("حدث خطأ أثناء قراءة الملف.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        async function exportAsImage() {
            const target = document.getElementById('export-target');
            const scrollArea = document.getElementById('canvas-scroll-area');
            
            // 1. إضافة مساحة الأمان قبل التصوير مباشرة (لتجنب القص)
            target.classList.add('export-mode');
            
            // إعطاء وقت قصير للمتصفح لتطبيق الكلاس الجديد
            await new Promise(resolve => setTimeout(resolve, 100));

            // حفظ موقع الـ Scroll الحالي
            const originalScrollLeft = scrollArea.scrollLeft;
            const originalScrollTop = scrollArea.scrollTop;
            
            // تصفير الـ Scroll لتجنب أي قص من مكتبة التصوير
            scrollArea.scrollLeft = 0;
            scrollArea.scrollTop = 0;

            try {
                const canvas = await html2canvas(target, {
                    scale: 2, 
                    backgroundColor: "#ffffff",
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                });
                
                const link = document.createElement('a');
                link.download = `Fishbone_Diagram_Final.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } finally {
                // 2. إزالة مساحة الأمان وإعادة كل شيء لطبيعته بعد التصوير
                target.classList.remove('export-mode');
                scrollArea.scrollLeft = originalScrollLeft;
                scrollArea.scrollTop = originalScrollTop;
            }
        }

        updateUI();
    </script>
</body>
</html>
